<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yield Monitor Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #030d1f;
      --bg-card: #081a30;
      --bg-card-soft: #0b2441;
      --line: #123355;
      --text: #d7e6f8;
      --muted: #6d8fb2;
      --accent: #2de0c2;
      --accent-soft: #27c0c3;
      --warn: #f59e0b;
      --bad: #ef4444;
    }
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; margin: 0; background: var(--bg); color: var(--text); }
    header {
      display: flex; justify-content: space-between; align-items: center; padding: 14px 22px;
      background: #031226; border-bottom: 1px solid var(--line);
    }
    h1 { margin: 0; font-size: 24px; letter-spacing: 0.6px; }
    .brand-accent { color: var(--accent); }
    .header-actions { display: flex; gap: 8px; }
    button {
      border: 1px solid #1f4c73; background: #0a1e38; color: #c6dcf6;
      padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 12px;
    }
    .btn-primary { border-color: #17bfa8; color: #89f2de; }
    .btn-secondary { border-color: #4262ff; color: #bac7ff; }
    .btn-dark { border-color: #3a4f6e; }
    main { padding: 10px; }
    .app-shell {
      border: 1px solid var(--line); border-radius: 12px; padding: 10px;
      background: linear-gradient(180deg, rgba(13,39,69,0.4), rgba(4,18,37,0.4));
    }
    .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .panel {
      background: var(--bg-card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; min-height: 500px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.01);
    }
    .panel h2 {
      font-size: 10px; margin: 0 0 2px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted);
    }
    .panel-title-row {
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
    }
    .week-controls { display: flex; gap: 6px; }
    .week-controls button { padding: 5px 8px; font-size: 10px; }
    .panel .meta-value { font-size: 28px; font-weight: 700; color: #f2f8ff; margin-bottom: 8px; }
    .panel .meta-value span { font-size: 13px; color: var(--muted); font-weight: 500; }
    .chart-wrap { position: relative; width: 100%; margin-top: 50px; }
    .chart-wrap canvas { width: 100% !important; height: 100% !important; display: block; }
    .chart-wrap-daily { height: 450px; min-height: 340px; }
    .chart-wrap-pie { height: 280px; }
    #gaugeWrap { display: flex; flex-direction: column; align-items: center; justify-content: space-between; height: 100%; padding-bottom: 25px; }
    #yieldGauge { position: relative; width: 320px; height: 320px; }
    #yieldGauge svg { width: 100%; height: 100%; display: block; }
    .gauge-track {
      fill: none; stroke: rgba(45, 224, 194, 0.20); stroke-width: 10;
      stroke-linecap: butt;
    }
    .gauge-progress {
      fill: none; stroke: var(--accent); stroke-width: 10;
      stroke-linecap: butt;
      transition: stroke-dashoffset 300ms ease, stroke 250ms ease;
    }
    .gauge-center {
      position: absolute; left: 50%; top: 60%;
      transform: translate(-50%, -50%);
      text-align: center;
    }
    #yieldText { display: block; font-size: 38px; line-height: 1; font-weight: 700; color: #7bf4de; }
    .yield-label { display: block; margin-top: 2px; font-size: 9px; color: var(--muted); letter-spacing: 0.7px; text-transform: uppercase; }
    #selectedPart { display: block; margin-top: 2px; font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; }
    #gaugeStats { width: 100%; margin-top: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .stat-card {
      border: 1px solid var(--line); border-radius: 6px; background: #061a32; padding: 7px 8px;
    }
    .stat-label { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; }
    .stat-value { font-size: 21px; font-weight: 700; color: #e9f2ff; margin-top: 2px; }
    .part-legend { margin-top: 130px; font-size: 11px; color: var(--muted); }
    .part-legend div {
      display: flex; justify-content: space-between; margin-bottom: 4px;
      cursor: pointer; border: 1px solid transparent; border-radius: 4px; padding: 2px 4px;
    }
    .part-legend div:hover { border-color: #1f4c73; background: rgba(37, 134, 200, 0.12); }
    .legend-left { display: inline-flex; align-items: center; gap: 7px; color: #6d8fb2; }
    .legend-dot { font-size: 15px; line-height: 1; }
    .legend-part { color: #6d8fb2; }
    .part-legend div.selected .legend-part { color: #f2f8ff; font-weight: 700; }
    .modal {
      display: none; position: fixed; z-index: 1000; inset: 0;
      background: rgba(1, 9, 22, 0.65); align-items: center; justify-content: center;
      padding: 12px;
    }
    .modal-content {
      position: relative;
      width: 360px; border-radius: 12px; padding: 10px 10px 12px;
      background: #081d35; border: 1px solid #124264;
      box-shadow: 0 18px 44px rgba(0,0,0,0.5);
    }
    .modal-border {
      position: absolute;
      top: 0;
      left: 8%;
      width: 84%;
      height: 0;
      border-top: 1px solid #0fd2b7;
      z-index: 1;
    }
    .modal-header {
      display: flex;
      align-items:
      center;
      gap: 8px;
      margin-bottom: 10px;
      padding-top: 8px;
    }
    .modal-icon-wrapper {
      width: 28px;
      height: 28px;
      border: 1px solid #0fd2b7;
      border-radius: 6px;
      display: flex;
      align-items: center;
      padding-left: 4px;
    }
    .modal-icon {
      width: 8px;
      height: 16px;
      border: 1px solid #0fd2b7;
    }
    .modal-title-wrap h2 { margin: 0; font-size: 20px; color: #e2f2ff; line-height: 1; }
    .modal-subtitle {
      margin-top: 2px; font-size: 9px; letter-spacing: 0.7px;
      color: #5f86aa; text-transform: uppercase;
    }
    .form-row { margin-bottom: 10px; }
    .form-row label {
      display: block; margin-bottom: 5px; font-size: 9px;
      color: #5f86aa; text-transform: uppercase; letter-spacing: 0.7px;
    }
    .form-row input, .form-row select {
      width: 100%; padding: 10px; border: 1px solid #0e4f73; border-radius: 6px;
      background: #041729; color: #cae8ff; font-size: 12px;
    }
    .form-row input:focus, .form-row select:focus {
      outline: none; border-color: #16c7ac; box-shadow: 0 0 0 2px rgba(22,199,172,0.15);
    }
    .form-row input::placeholder,
    .form-row select::placeholder {
      color: #497ea6;
      opacity: 1;
    }
    .timestamp-box {
      border: 1px solid #0e4f73; border-radius: 6px; background: #041729;
      color: #cae8ff; padding: 6px; font-size: 12px;
      display: flex; align-items: center; gap: 4px;
    }
    .timestamp-icon {
      color: #7fa3c5; font-size: 14px; line-height: 1;
    }
    .status-row { display: flex; align-items: center; gap: 8px; color: #7fa3c5; font-size: 12px; }
    .status-row input[type="checkbox"] {
      width: 14px; height: 14px; accent-color: #2de0c2; margin: 0;
    }
    .status-row label {
      margin-bottom: 0;
    }
    .modal-actions { display: flex; gap: 8px; margin-top: 12px; }
    #addTestBtn {
      flex: 1;
      background: #062c29;
      color: #2de0c2;
      border: 1px solid #1ad5b9;
      font-size: 16px;
      font-weight: 700;
      padding: 9px 12px;
    }
    .inline-muted { font-size: 12px; color: #7fa3c5; }
    #yieldRatePartTitle {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }
    @media (max-width: 1100px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>YIELD <span class="brand-accent">MONITOR</span></h1>
    <div class="header-actions">
      <button id="manualTestBtn" class="btn-primary">Manual Test</button>
      <button id="viewApiBtn" class="btn-secondary">View API</button>
      <button id="viewScriptBtn" class="btn-dark">View Script</button>
    </div>
  </header>

  <main>
    <div class="app-shell">
    <div class="grid">
      <section class="panel">
        <div class="panel-title-row">
          <h2>Daily Testing Volume</h2>
          <div class="week-controls">
            <button id="previousWeekBtn">Previous week</button>
            <button id="todayWeekBtn">Today</button>
            <button id="nextWeekBtn">Next week</button>
          </div>
        </div>
        <div id="dailyMeta" class="meta-value">0 <span>units / 7 days</span></div>
        <div class="chart-wrap chart-wrap-daily">
          <canvas id="dailyChart"></canvas>
        </div>
      </section>
      <section class="panel">
        <h2>Part Number Distribution</h2>
        <div class="chart-wrap chart-wrap-pie">
          <canvas id="partPieChart"></canvas>
        </div>
        <div id="partLegend" class="part-legend"></div>
      </section>
      <section class="panel">
        <h2>Yield Rate</h2>
        <div id="yieldRatePartTitle" class="inline-muted">N/A</div>
        <div id="gaugeWrap">
          <div id="yieldGauge">
            <svg viewBox="0 0 270 270" aria-hidden="true">
              <g id="gaugeGroup" transform="rotate(-216 135 135)">
                <circle class="gauge-track" cx="135" cy="135" r="96"></circle>
                <circle id="gaugeProgress" class="gauge-progress" cx="135" cy="135" r="96"></circle>
              </g>
            </svg>
            <div class="gauge-center">
              <span id="yieldText">0%</span>
              <span class="yield-label">Yield</span>
              <span id="selectedPart">Part: N/A</span>
            </div>
          </div>
          <div id="gaugeStats">
            <div class="stat-card"><div class="stat-label">Tested</div><div id="testedVal" class="stat-value">0</div></div>
            <div class="stat-card"><div class="stat-label">Passed</div><div id="passedVal" class="stat-value">0</div></div>
            <div class="stat-card"><div class="stat-label">Failed</div><div id="failedVal" class="stat-value">0</div></div>
            <div class="stat-card"><div class="stat-label">Yield</div><div id="yieldVal" class="stat-value">0%</div></div>
          </div>
        </div>
      </section>
    </div>
    </div>
  </main>

  <div id="manualModal" class="modal" role="dialog" aria-modal="true">
    <div class="modal-content">
      <div class="modal-border"></div>
      <div class="modal-header">
        <div class="modal-icon-wrapper"><div class="modal-icon"></div></div>
        <div class="modal-title-wrap">
          <h2>Manual Testing</h2>
          <div class="modal-subtitle">Unit Entry Form</div>
        </div>
      </div>
      <div class="form-row">
        <label for="serialNumber">Serial Number</label>
        <input id="serialNumber" type="text" placeholder="Enter serial number" />
      </div>
      <div class="form-row">
        <label for="partNumber">Part Number</label>
        <select id="partNumber">
          <option value="001PN001">001PN001</option>
          <option value="002PN002">002PN002</option>
          <option value="003PN003">003PN003</option>
        </select>
      </div>
      <div class="form-row">
        <label>Timestamp</label>
        <div class="timestamp-box">
          <span class="timestamp-icon" aria-hidden="true">🕒</span>
          <span id="timestampLabel"></span>
        </div>
      </div>
      <div class="form-row status-row">
        <input id="statusCheckbox" type="checkbox" />
        <label for="statusCheckbox">Status (Unchecked = Failed / Checked = Pass)</label>
      </div>
      <div class="modal-actions">
        <button id="addTestBtn" class="btn-primary">+ Add</button>
      </div>
    </div>
  </div>

  <script src="/static/dashboard.js"></script>
</body>
</html>
