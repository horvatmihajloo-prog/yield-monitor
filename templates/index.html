<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yield Monitor Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #030d1f;
      --bg-card: #081a30;
      --bg-card-soft: #0b2441;
      --line: #123355;
      --text: #d7e6f8;
      --muted: #6d8fb2;
      --accent: #2de0c2;
      --accent-soft: #27c0c3;
      --warn: #f59e0b;
      --bad: #ef4444;
    }
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; margin: 0; background: var(--bg); color: var(--text); }
    header {
      display: flex; justify-content: space-between; align-items: center; padding: 14px 22px;
      background: #031226; border-bottom: 1px solid var(--line);
    }
    h1 { margin: 0; font-size: 24px; letter-spacing: 0.6px; }
    .brand-accent { color: var(--accent); }
    .header-actions { display: flex; gap: 8px; }
    button {
      border: 1px solid #1f4c73; background: #0a1e38; color: #c6dcf6;
      padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 12px;
    }
    .btn-primary { border-color: #17bfa8; color: #89f2de; }
    .btn-secondary { border-color: #4262ff; color: #bac7ff; }
    .btn-dark { border-color: #3a4f6e; }
    main { padding: 10px; }
    .app-shell {
      border: 1px solid var(--line); border-radius: 12px; padding: 10px;
      background: linear-gradient(180deg, rgba(13,39,69,0.4), rgba(4,18,37,0.4));
    }
    .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .panel {
      background: var(--bg-card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; min-height: 500px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.01);
    }
    .panel h2 {
      font-size: 10px; margin: 0 0 2px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted);
    }
    .panel .meta-value { font-size: 28px; font-weight: 700; color: #f2f8ff; margin-bottom: 8px; }
    .panel .meta-value span { font-size: 13px; color: var(--muted); font-weight: 500; }
    .chart-wrap { position: relative; width: 100%; }
    .chart-wrap canvas { width: 100% !important; height: 100% !important; display: block; }
    .chart-wrap-daily { height: 450px; min-height: 340px; }
    .chart-wrap-pie { height: 280px; }
    #gaugeWrap { display: flex; flex-direction: column; align-items: center; justify-content: space-between; height: 100%; padding-bottom: 25px; }
    #yieldGauge { position: relative; width: 320px; height: 320px; }
    #yieldGauge svg { width: 100%; height: 100%; display: block; }
    .gauge-track {
      fill: none; stroke: rgba(45, 224, 194, 0.20); stroke-width: 10;
      stroke-linecap: butt;
    }
    .gauge-progress {
      fill: none; stroke: var(--accent); stroke-width: 10;
      stroke-linecap: butt;
      transition: stroke-dashoffset 300ms ease, stroke 250ms ease;
    }
    .gauge-center {
      position: absolute; left: 50%; top: 60%;
      transform: translate(-50%, -50%);
      text-align: center;
    }
    #yieldText { display: block; font-size: 38px; line-height: 1; font-weight: 700; color: #7bf4de; }
    .yield-label { display: block; margin-top: 2px; font-size: 9px; color: var(--muted); letter-spacing: 0.7px; text-transform: uppercase; }
    #selectedPart { display: block; margin-top: 2px; font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; }
    #gaugeStats { width: 100%; margin-top: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .stat-card {
      border: 1px solid var(--line); border-radius: 6px; background: #061a32; padding: 7px 8px;
    }
    .stat-label { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; }
    .stat-value { font-size: 21px; font-weight: 700; color: #e9f2ff; margin-top: 2px; }
    .part-legend { margin-top: 130px; font-size: 11px; color: var(--muted); }
    .part-legend div {
      display: flex; justify-content: space-between; margin-bottom: 4px;
      cursor: pointer; border: 1px solid transparent; border-radius: 4px; padding: 2px 4px;
    }
    .part-legend div:hover { border-color: #1f4c73; background: rgba(37, 134, 200, 0.12); }
    .legend-left { display: inline-flex; align-items: center; gap: 7px; color: #6d8fb2; }
    .legend-dot { font-size: 15px; line-height: 1; }
    .legend-part { color: #6d8fb2; }
    .part-legend div.selected .legend-part { color: #f2f8ff; font-weight: 700; }
    .modal {
      display: none; position: fixed; z-index: 1000; inset: 0;
      background: rgba(1, 9, 22, 0.65); align-items: center; justify-content: center;
      padding: 12px;
    }
    .modal-content {
      width: 360px; border-radius: 12px; padding: 10px 10px 12px;
      background: #081d35; border: 1px solid #124264;
      box-shadow: 0 18px 44px rgba(0,0,0,0.5);
    }
    .modal-header {
      display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
      border-top: 1px solid #0fd2b7; padding-top: 8px;
    }
    .modal-icon {
      width: 18px; height: 18px; border: 1px solid #0fd2b7;
      border-radius: 4px; color: #0fd2b7; display: flex; align-items: center; justify-content: center;
      font-size: 10px;
    }
    .modal-title-wrap h2 { margin: 0; font-size: 28px; color: #e2f2ff; line-height: 1; }
    .modal-subtitle {
      margin-top: 2px; font-size: 9px; letter-spacing: 0.7px;
      color: #5f86aa; text-transform: uppercase;
    }
    .form-row { margin-bottom: 10px; }
    .form-row label {
      display: block; margin-bottom: 5px; font-size: 9px;
      color: #5f86aa; text-transform: uppercase; letter-spacing: 0.7px;
    }
    .form-row input, .form-row select {
      width: 100%; padding: 10px; border: 1px solid #0e4f73; border-radius: 6px;
      background: #041729; color: #cae8ff; font-size: 12px;
    }
    .form-row input:focus, .form-row select:focus {
      outline: none; border-color: #16c7ac; box-shadow: 0 0 0 2px rgba(22,199,172,0.15);
    }
    .timestamp-box {
      border: 1px solid #0e4f73; border-radius: 6px; background: #041729;
      color: #2de0c2; padding: 10px; font-size: 12px;
    }
    .status-row { display: flex; align-items: center; gap: 8px; color: #7fa3c5; font-size: 12px; }
    .status-row input[type="checkbox"] {
      width: 14px; height: 14px; accent-color: #2de0c2; margin: 0;
    }
    .modal-actions { display: flex; gap: 8px; margin-top: 12px; }
    #addTestBtn {
      flex: 1;
      background: #062c29;
      color: #2de0c2;
      border: 1px solid #1ad5b9;
      font-size: 16px;
      font-weight: 700;
      padding: 9px 12px;
    }
    .inline-muted { font-size: 12px; color: #7fa3c5; }
    @media (max-width: 1100px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>YIELD <span class="brand-accent">MONITOR</span></h1>
    <div class="header-actions">
      <button id="manualTestBtn" class="btn-primary">Manual Test</button>
      <button id="viewApiBtn" class="btn-secondary">View API</button>
      <button id="viewScriptBtn" class="btn-dark">View Script</button>
    </div>
  </header>

  <main>
    <div class="app-shell">
    <div class="grid">
      <section class="panel">
        <h2>Daily Testing Volume (Last 7 Days)</h2>
        <div id="dailyMeta" class="meta-value">0 <span>units / 7 days</span></div>
        <div class="chart-wrap chart-wrap-daily">
          <canvas id="dailyChart"></canvas>
        </div>
      </section>
      <section class="panel">
        <h2>Part Number Distribution</h2>
        <div class="chart-wrap chart-wrap-pie">
          <canvas id="partPieChart"></canvas>
        </div>
        <div id="partLegend" class="part-legend"></div>
      </section>
      <section class="panel">
        <h2>Yield Rate</h2>
        <div id="yieldRatePartTitle" class="inline-muted">Part: N/A</div>
        <div id="gaugeWrap">
          <div id="yieldGauge">
            <svg viewBox="0 0 270 270" aria-hidden="true">
              <g id="gaugeGroup" transform="rotate(-216 135 135)">
                <circle class="gauge-track" cx="135" cy="135" r="96"></circle>
                <circle id="gaugeProgress" class="gauge-progress" cx="135" cy="135" r="96"></circle>
              </g>
            </svg>
            <div class="gauge-center">
              <span id="yieldText">0%</span>
              <span class="yield-label">Yield</span>
              <span id="selectedPart">Part: N/A</span>
            </div>
          </div>
          <div id="gaugeStats">
            <div class="stat-card"><div class="stat-label">Tested</div><div id="testedVal" class="stat-value">0</div></div>
            <div class="stat-card"><div class="stat-label">Passed</div><div id="passedVal" class="stat-value">0</div></div>
            <div class="stat-card"><div class="stat-label">Failed</div><div id="failedVal" class="stat-value">0</div></div>
            <div class="stat-card"><div class="stat-label">Yield</div><div id="yieldVal" class="stat-value">0%</div></div>
          </div>
        </div>
      </section>
    </div>
    </div>
  </main>

  <div id="manualModal" class="modal" role="dialog" aria-modal="true">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-icon">[]</div>
        <div class="modal-title-wrap">
          <h2>Manual Testing</h2>
          <div class="modal-subtitle">Unit Entry Form</div>
        </div>
      </div>
      <div class="form-row">
        <label for="serialNumber">Serial Number</label>
        <input id="serialNumber" type="text" placeholder="Enter serial number" />
      </div>
      <div class="form-row">
        <label for="partNumber">Part Number</label>
        <select id="partNumber">
          <option value="001PN001">001PN001</option>
          <option value="002PN002">002PN002</option>
          <option value="003PN003">003PN003</option>
        </select>
      </div>
      <div class="form-row">
        <label>Timestamp</label>
        <div id="timestampLabel" class="timestamp-box"></div>
      </div>
      <div class="form-row status-row">
        <input id="statusCheckbox" type="checkbox" />
        <label for="statusCheckbox">Status (Unchecked = Failed / Checked = Pass)</label>
      </div>
      <div class="modal-actions">
        <button id="addTestBtn" class="btn-primary">+ Add</button>
      </div>
    </div>
  </div>

  <script>
    let dailyChart;
    let pieChart;
    let statsData = [];
    let gaugeLength = 0;
    const GAUGE_ARC_RATIO = 0.7;
    const doughnutCenterTextPlugin = {
      id: "doughnutCenterText",
      afterDraw(chart, args, options) {
        if (chart.config.type !== "doughnut") return;
        const { ctx } = chart;
        const meta = chart.getDatasetMeta(0);
        if (!meta?.data?.length) return;
        const x = meta.data[0].x;
        const y = meta.data[0].y;
        const total = (chart.data.datasets[0].data || []).reduce((sum, n) => sum + n, 0);

        ctx.save();
        ctx.textAlign = "center";
        ctx.fillStyle = "#6d8fb2";
        ctx.font = "700 11px Arial";
        ctx.fillText("TOTAL", x, y - 8);
        ctx.fillStyle = "#e9f2ff";
        ctx.font = "700 36px Arial";
        ctx.fillText(String(total), x, y + 24);
        ctx.fillStyle = "#6d8fb2";
        ctx.font = "600 14px Arial";
        ctx.fillText("units", x, y + 44);
        ctx.restore();
      }
    };
    Chart.register(doughnutCenterTextPlugin);

    const dailyBarDesignPlugin = {
      id: "dailyBarDesign",
      afterDatasetsDraw(chart) {
        if (chart.canvas?.id !== "dailyChart" || chart.config.type !== "bar") return;
        const { ctx } = chart;
        const meta = chart.getDatasetMeta(0);
        const data = chart.data.datasets[0].data || [];
        if (!meta?.data?.length) return;

        ctx.save();
        meta.data.forEach((bar, idx) => {
          const value = data[idx];
          const props = bar.getProps(["x", "y", "base", "width"], true);
          const left = props.x - props.width / 2 + 2;
          const right = props.x + props.width / 2 - 2;
          const height = props.base - props.y;

          // Draw segmented separator lines inside each bar.
          ctx.strokeStyle = "#163a5a";
          ctx.lineWidth = 1;
          for (let i = 1; i <= 3; i += 1) {
            const lineY = props.base - (height * i) / 4;
            ctx.beginPath();
            ctx.moveTo(left, lineY);
            ctx.lineTo(right, lineY);
            ctx.stroke();
          }

          // Draw value label above each bar.
          ctx.fillStyle = "#5e87ac";
          ctx.font = "700 11px Arial";
          ctx.textAlign = "center";
          ctx.fillText(String(value), props.x, props.y - 8);
        });
        ctx.restore();
      }
    };
    Chart.register(dailyBarDesignPlugin);

    function formatShortDate(isoDate) {
      return new Date(isoDate + "T00:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric" });
    }

    function getYieldColor(value) {
      if (value >= 90) return "#10b981";
      if (value >= 80) return "#f59e0b";
      return "#ef4444";
    }

    function updateGauge(partNumber, yieldPercent) {
      const progress = document.getElementById("gaugeProgress");
      const track = document.querySelector(".gauge-track");
      const text = document.getElementById("yieldText");
      const selected = document.getElementById("selectedPart");
      const panelTitlePart = document.getElementById("yieldRatePartTitle");
      const percent = Math.max(0, Math.min(100, yieldPercent));
      const color = "#2de0c2";
      const visibleArcLength = gaugeLength * GAUGE_ARC_RATIO;
      const hiddenArcLength = Math.max(gaugeLength - visibleArcLength, 0.001);
      const filledLength = visibleArcLength * (percent / 100);
      const remainingVisible = Math.max(visibleArcLength - filledLength, 0.001);

      track.style.strokeDasharray = `${visibleArcLength} ${hiddenArcLength}`;
      track.style.strokeDashoffset = 0;
      progress.style.stroke = color;
      progress.style.strokeDasharray = `${filledLength} ${remainingVisible + hiddenArcLength}`;
      progress.style.strokeDashoffset = 0;
      text.textContent = `${percent.toFixed(1)}%`;
      selected.textContent = partNumber;
      panelTitlePart.textContent = `Part: ${partNumber}`;
    }

    function updateGaugeStats(selected) {
      const failed = selected.total_tested - selected.passed;
      document.getElementById("testedVal").textContent = selected.total_tested;
      document.getElementById("passedVal").textContent = selected.passed;
      document.getElementById("failedVal").textContent = failed;
      document.getElementById("yieldVal").textContent = `${selected.yield_percent.toFixed(1)}%`;
    }

    async function fetchDailyData() {
      const res = await fetch("/daily");
      return res.json();
    }

    async function fetchStatsData() {
      const res = await fetch("/stats");
      return res.json();
    }

    function renderDailyChart(daily) {
      const labels = daily.map((d) => formatShortDate(d.date));
      const counts = daily.map((d) => d.count);
      const total = counts.reduce((sum, value) => sum + value, 0);
      document.getElementById("dailyMeta").innerHTML = `${total} <span>units / 7 days</span>`;
      if (dailyChart) dailyChart.destroy();
      dailyChart = new Chart(document.getElementById("dailyChart"), {
        type: "bar",
        data: {
          labels,
          datasets: [{
            label: "Units Tested",
            data: counts,
            backgroundColor: counts.map((_, idx) => idx === counts.length - 1 ? "#2de0c2" : "#2f6f92"),
            borderRadius: 5,
            borderSkipped: false,
            clip: false,
            barThickness: 38,
            categoryPercentage: 0.86,
            barPercentage: 0.96
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          layout: { padding: { top: 24 } },
          plugins: { legend: { display: false } },
          scales: {
            x: {
              ticks: { color: "#4f79a2", font: { size: 10, weight: "700" } },
              grid: { display: false },
              border: { display: false }
            },
            y: {
              display: false,
              grid: { display: false },
              border: { display: false },
              beginAtZero: true
            }
          }
        }
      });
    }

    function renderPieChart(stats) {
      const labels = stats.map((s) => s.part_number);
      const values = stats.map((s) => s.total_tested);
      const colors = ["#2de0c2", "#2586c8", "#f5a623"];
      if (pieChart) pieChart.destroy();
      const legendContainer = document.getElementById("partLegend");
      legendContainer.innerHTML = stats.map((s, idx) =>
        `<div data-part="${s.part_number}">
          <span class="legend-left">
            <span class="legend-dot" style="color:${colors[idx % colors.length]}">●</span>
            <span class="legend-part">${s.part_number}</span>
          </span>
          <span>${s.total_tested}</span>
        </div>`
      ).join("");

      const selectPart = (partNumber) => {
        const selected = stats.find((item) => item.part_number === partNumber);
        if (!selected) return;
        legendContainer.querySelectorAll("div[data-part]").forEach((row) => {
          row.classList.toggle("selected", row.getAttribute("data-part") === partNumber);
        });
        updateGauge(selected.part_number, selected.yield_percent);
        updateGaugeStats(selected);
      };

      legendContainer.querySelectorAll("div[data-part]").forEach((row) => {
        row.addEventListener("click", () => selectPart(row.getAttribute("data-part")));
      });

      pieChart = new Chart(document.getElementById("partPieChart"), {
        type: "doughnut",
        data: {
          labels,
          datasets: [{ data: values, backgroundColor: colors, borderWidth: 0, hoverBorderWidth: 0 }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          cutout: "48%",
          plugins: { legend: { display: false } },
          onClick: (event, elements) => {
            if (!elements.length) return;
            const index = elements[0].index;
            selectPart(stats[index].part_number);
          }
        }
      });

      if (stats.length > 0) {
        selectPart(stats[0].part_number);
      }
    }

    async function refreshDashboard() {
      const [daily, stats] = await Promise.all([fetchDailyData(), fetchStatsData()]);
      statsData = stats;
      renderDailyChart(daily);
      renderPieChart(statsData);
    }

    async function addManualTest() {
      const serial = document.getElementById("serialNumber").value.trim();
      const part = document.getElementById("partNumber").value;
      const status = document.getElementById("statusCheckbox").checked;

      if (!serial) {
        alert("Serial number is required.");
        return;
      }

      const payload = { serial_number: serial, part_number: part, status: status };
      const res = await fetch("/tests", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        const err = await res.json();
        alert(`Failed to add test: ${err.detail || "Unknown error"}`);
        return;
      }

      document.getElementById("serialNumber").value = "";
      document.getElementById("statusCheckbox").checked = false;
      await refreshDashboard();
    }

    function updateClock() {
      document.getElementById("timestampLabel").textContent = new Date().toLocaleString();
    }

    function setupUiEvents() {
      const modal = document.getElementById("manualModal");
      document.getElementById("manualTestBtn").addEventListener("click", () => {
        modal.style.display = "flex";
      });
      document.getElementById("addTestBtn").addEventListener("click", addManualTest);
      document.getElementById("viewApiBtn").addEventListener("click", () => window.open("/docs", "_blank"));
      document.getElementById("viewScriptBtn").addEventListener("click", () => window.open("/static/test_yield.py", "_blank"));
      window.addEventListener("click", (event) => {
        if (event.target === modal) modal.style.display = "none";
      });
    }

    setupUiEvents();
    gaugeLength = document.getElementById("gaugeProgress").getTotalLength();
    document.getElementById("gaugeProgress").style.strokeDasharray = `0 ${gaugeLength}`;
    document.querySelector(".gauge-track").style.strokeDasharray = `${gaugeLength * GAUGE_ARC_RATIO} ${gaugeLength * (1 - GAUGE_ARC_RATIO)}`;
    updateClock();
    setInterval(updateClock, 1000);
    refreshDashboard();
  </script>
</body>
</html>
